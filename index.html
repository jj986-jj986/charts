<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts Layout</title>
    <link rel="stylesheet" href="https://unpkg.com/purecss@2.0.6/build/pure-min.css">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #yearSlider {
            width: 300px;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            outline: none;
        }

        #yearSlider::-webkit-slider-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #8a3034;
        }

        #chart_div, #chart_div_1, #chart_div_2 {
            width: 100%;
            height: 100%;
        }

        footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="pure-g">
        <header class="pure-u-1">
            <h1>Gini Index Dashboard</h1>
        </header>

        <main class="pure-u-1 pure-g">
            <!-- Chart Container: Left -->
            <section class="pure-u-1 pure-u-md-1-2">
                <div id="chart_div" class="pure-u">
                    <!-- Google Map Chart will be inserted here -->
                </div>
            </section>

            <!-- Chart Containers: Right -->
            <aside class="pure-u-1 pure-u-md-1-2">
                <div id="chart_div_1" class="pure-u">
                    <!-- Line Chart will be inserted here -->
                </div>
                <div id="chart_div_2" class="pure-u">
                    <!-- Pie Chart will be inserted here -->
                </div>
            </aside>
        </main>

        <footer>
            <label for="yearSlider">Year: </label>
            <span id="yearValue">2010</span>
            <input type="range" id="yearSlider" min="2010" max="2021" value="2010">
        </footer>
    </div>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {
            'packages': ['geochart', 'corechart', 'controls']
        });
        google.charts.setOnLoadCallback(drawCharts);

        function drawCharts() {
            var queryString = encodeURIComponent('SELECT A,B,C,D,E,F,G,I');
            var query = new google.visualization.Query(
                'https://docs.google.com/spreadsheets/d/1RORwncs0WaVaq2YecdBS0bZ09ouILOTzTt-DmYtdPFw/gviz/tq?sheet=' + 
                encodeURIComponent('Sheet2') + '&headers=1&tq=' + queryString
            );
            query.send(handleDataResponse);
        }

        function handleDataResponse(response) {
            if (response.isError()) {
                alert('Error in query: ' + response.getMessage() + ' ' + response.getDetailedMessage());
                return;
            }
            var data = response.getDataTable();

            var dashboard = new google.visualization.Dashboard(
                document.getElementById('dashboard_div')
            );

            var categoryFilter = new google.visualization.ControlWrapper({
                'controlType': 'CategoryFilter',
                'containerId': 'filter_div',
                'options': {
                    'filterColumnIndex': 0,
                    'ui': {
                        'label': 'Selected Year',
                        'allowTyping': false,
                        'allowMultiple': false
                    }
                }
            });

            var categoryFilter_1 = new google.visualization.ControlWrapper({
                'controlType': 'CategoryFilter',
                'containerId': 'filter_div_1',
                'options': {
                    'filterColumnIndex': 1,
                    'ui': {
                        'label': 'Selected UF',
                        'allowTyping': false,
                        'allowMultiple': false
                    }
                }
            });

            var geochart = new google.visualization.ChartWrapper({
                'chartType': 'GeoChart',
                'containerId': 'chart_div',
                'options': {
                    'region': 'BR',
                    'displayMode': 'regions',
                    'resolution': 'provinces',
                    'colorAxis': {
                        'colors': ['#d6bbbb', '#b55b5b']
                    }
                }
            });

            var lineGraph = new google.visualization.ChartWrapper({
                'chartType': 'LineChart',
                'containerId': 'chart_div_1',
                'options': {
                    'title': 'Gini Index Dynamics',
                    'backgroundColor': '#f5f5f5',
                    'hAxis': { 'title': 'Year' },
                    'vAxis': { 'title': 'Gini Index' },
                    'colors': ['#a91919']
                }
            });

            var structurePie = new google.visualization.ChartWrapper({
                'chartType': 'PieChart',
                'containerId': 'chart_div_2',
                'options': {
                    'backgroundColor': '#f5f5f5',
                    'title': 'Real GDP Structure',
                    'colors': ['#66a26d', '#b55b5b', '#eed67d', '#4682b4', '#a9a9a9']
                }
            });

            dashboard.bind(categoryFilter, geochart);
            dashboard.bind(categoryFilter_1, lineGraph);
            dashboard.bind(categoryFilter_1, structurePie);

            dashboard.draw(data);

            // Обработчик ползунка
            document.getElementById('yearSlider').addEventListener('input', function() {
                var year = this.value;
                categoryFilter.setState({ 'selectedValues': [year] });
                document.getElementById('yearValue').textContent = year;
                dashboard.draw(data);
            });

            // Обработчик выбора на карте
            google.visualization.events.addListener(geochart, 'select', function() {
                var selectedItem = geochart.getChart().getSelection()[0];
                if (selectedItem) {
                    var selectedUF = data.getValue(selectedItem.row, 1);
                    categoryFilter_1.setState({'selectedValues': [selectedUF]});
                    dashboard.draw(data);
                }
            });

            // Обработчик для фильтра по году
            google.visualization.events.addListener(categoryFilter, 'statechange', function() {
                var selectedYear = categoryFilter.getState().selectedValues[0];
                var filteredData = data.getFilteredRows([{ column: 0, value: selectedYear }]);
                var updData = new google.visualization.DataTable();
                updData.addColumn('string', 'Sector');
                updData.addColumn('number', 'Value');
                if (filteredData.length > 0) {
                    updData.addRows([
                        ['Agriculture', data.getValue(filteredData[0], 3)],
                        ['Industry', data.getValue(filteredData[0], 4)],
                        ['Services', data.getValue(filteredData[0], 5)],
                        ['Public Sector', data.getValue(filteredData[0], 6)],
                        ['Others', data.getValue(filteredData[0], 7)]
                    ]);
                }
                structurePie.setDataTable(updData);
                structurePie.draw();
            });

            // Обработчик для фильтра по UF
            google.visualization.events.addListener(categoryFilter_1, 'statechange', function() {
                var selectedUF = categoryFilter_1.getState().selectedValues[0];
                var filteredData = data.getFilteredRows([{ column: 1, value: selectedUF }]);
                var updData = new google.visualization.DataTable();
                updData.addColumn('string', 'Sector');
                updData.addColumn('number', 'Value');
                if (filteredData.length > 0) {
                    updData.addRows([
                        ['Agriculture', data.getValue(filteredData[0], 3)],
                        ['Industry', data.getValue(filteredData[0], 4)],
                        ['Services', data.getValue(filteredData[0], 5)],
                        ['Public Sector', data.getValue(filteredData[0], 6)],
                        ['Others', data.getValue(filteredData[0], 7)]
                    ]);
                }
                structurePie.setDataTable(updData);
                structurePie.draw();
            });
        }
    </script>

</body>
</html>
