<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
      /* Ваши стили */
    </style>
    <script type="text/javascript">
      window.onload = function() {
        google.charts.load('current', {
          'packages': ['geochart', 'controls']
        });

        google.charts.setOnLoadCallback(drawSheetName);

        function drawSheetName() {
          try {
            var queryString = encodeURIComponent('SELECT A,B,C,D,E,F,G,I');
            var query = new google.visualization.Query(
              'https://docs.google.com/spreadsheets/d/1RORwncs0WaVaq2YecdBS0bZ09ouILOTzTt-DmYtdPFw/gviz/tq?sheet=' +
              encodeURIComponent('Sheet2') + '&headers=1&tq=' + queryString
            );
            query.send(handleSampleDataQueryResponse);
          } catch (error) {
            console.error("Ошибка при запросе данных:", error);
          }
        }

        function handleSampleDataQueryResponse(response) {
          try {
            if (response.isError()) {
              throw new Error('Ошибка в запросе: ' + response.getMessage() + ' ' + response.getDetailedMessage());
            }

            var data = response.getDataTable();
            var dashboard = new google.visualization.Dashboard(
              document.getElementById('dashboard_div')
            );

            // Убедитесь, что элементы существуют
            if (!document.getElementById('chart_div') || !document.getElementById('chart_div_1') || !document.getElementById('chart_div_2')) {
              throw new Error("Один или несколько контейнеров не найдены на странице.");
            }

            var categoryFilter = new google.visualization.ControlWrapper({
              'controlType': 'CategoryFilter',
              'containerId': 'filter_div',
              'options': {
                'filterColumnIndex': 0,  
                'ui': {
                  'label': 'Selected Year',
                  'allowTyping': false,
                  'allowMultiple': false
                }
              }
            });

            var geochart = new google.visualization.ChartWrapper({
              'chartType': 'GeoChart',
              'containerId': 'chart_div',
              'options': {
                title: "Gini Index by State",
                backgroundColor: '#eeeeee',
                'region': 'BR',
                'displayMode': 'regions',
                'resolution': 'provinces',
                'colorAxis': {
                  'colors': ['#d6bbbb', '#b55b5b']
                }
              },
              'view': {'columns': [1,2]},
            });

            geochart.setDataTable(data);
            dashboard.bind(categoryFilter, geochart);

            var lineGraph = new google.visualization.ChartWrapper({
              'chartType': 'LineChart',
              'containerId': 'chart_div_1',
              'options': {
                title: "Gini Index Dynamics",
                backgroundColor: '#f5f5f5',
                hAxis: { title: "Year" },
                vAxis: { title: "Gini Index" },
                colors: ['#a91919']
              },
              'view': {'columns': [0,2]}
            });
            lineGraph.setDataTable(data);
            dashboard.bind(categoryFilter, lineGraph);

            var structurePie = new google.visualization.ChartWrapper({
              'chartType': 'PieChart',
              'containerId': 'chart_div_2',
              'options': {
                backgroundColor: '#f5f5f5',
                title: "Real GDP Structure",
                colors: ['#66a26d', '#b55b5b', '#eed67d', '#4682b4', '#a9a9a9']
              }
            });

            dashboard.draw(data);
          } catch (error) {
            console.error("Ошибка при обработке данных: ", error);
          }
        }
      };
    </script>
  </head>
  <body>
    <header>
      <label for="chart_div">Gini Index by State</label>
    </header>

    <main>
      <section id="left-column">
        <div id="chart_div" style="height: 60vh;"></div>
      </section>
      <aside id="right-column">
        <div id="chart_div_1" style="height: 25vh;"></div>
        <div id="chart_div_2" style="height: 35vh;"></div>
      </aside>
    </main>

    <footer>
      <label for="yearSlider">Year: </label>
      <span id="yearValue">2010</span>
      <input type="range" id="yearSlider" min="2010" max="2021" value="2010">
    </footer>
  </body>
</html>
