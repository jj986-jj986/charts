<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {
        'packages': ['geochart', 'table']
      });
      google.charts.setOnLoadCallback(drawSheetName);

      function drawSheetName() {
        var queryString = encodeURIComponent('SELECT A,B LIMIT 27');

        var query = new google.visualization.Query(
          'https://docs.google.com/spreadsheets/d/1RORwncs0WaVaq2YecdBS0bZ09ouILOTzTt-DmYtdPFw/gviz/tq?sheet=' + 
          encodeURIComponent('gini') + '&headers=1&tq=' + queryString
        );
        query.send(handleSampleDataQueryResponse);
      }

      function handleSampleDataQueryResponse(response) {
        if (response.isError()) {
          alert('Error in query: ' + response.getMessage() + ' ' + response.getDetailedMessage());
          return;
        }

        var data = response.getDataTable();
        var dashboard = new google.visualization.Dashboard(
          document.getElementById('dashboard_div'));
        
        var timeline = new google.visualization.ControlWrapper({
          'controlType': 'NumberRangeFilter',
          'containerId': 'filter_div',
          'options': {
            'filterColumnLabel': 'Year',
            'ui': {
              'minValue': 2010, 
              'maxValue': 2021,
              'label': 'Year Range'
            }
          }
        });

        var geochart = new google.visualization.GeoChart(document.getElementById('chart_div'));
        var options = {
          region: 'BR',           
          displayMode: 'regions',
          resolution: 'provinces',
          colorAxis: {
            colors: ['#acb2b9', '#2f3f4f']
          }
        };

        // Calculate Geometric Mean
        function calculateGeometricMean(startYear, endYear) {
          var product = 1;
          var count = 0;

          // Индексы Джини лежат в колонках, а годы - в строках
          for (var i = 1; i < data.getNumberOfColumns(); i++) {  // Begin from index 1 to avoid first column (States)
            var year = parseInt(data.getColumnLabel(i), 10);  // Get the year from column label

            if (year >= startYear && year <= endYear) {
              var giniIndex = data.getValue(0, i);  // Get Gini Index for first state
              product *= giniIndex;
              count++;
            }
          }

          if (count > 0) {
            return Math.pow(product, 1 / count);  // Return geometric mean
          } else {
            return null;  // If no data in selected range
          }
        }

        // Bind the timeline filter to the geochart
        dashboard.bind(timeline, geochart);

        // Now, draw the GeoChart, not the dashboard
        geochart.draw(data, options);

        // Add event listener to update the geometric mean when filter changes
        google.visualization.events.addListener(timeline, 'statechange', function () {
          var state = timeline.getState();
          var startYear = state.range.start;
          var endYear = state.range.end;

          var geometricMean = calculateGeometricMean(startYear, endYear);
          console.log("Geometric Mean for " + startYear + " to " + endYear + ": " + geometricMean);
        });
      }
    </script>
  </head>

  <body>
    <div id="dashboard_div">
      <div id="filter_div" style="width: 900px; height: 100px;"></div>
      <div id="chart_div" style="width: 900px; height: 400px;"></div>
    </div>
  </body>
</html>
