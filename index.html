<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Графики</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/base-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css">
  <style>
    /* Ваши дополнительные стили для графиков и других элементов */
    #chart_div, #chart_div_1, #chart_div_2 {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header class="pure-u-1">
    <label for="chart_div">Gini Index by State</label>
  </header>

  <main class="pure-g">
    <section class="pure-u-1 pure-u-md-2-3" id="left-column">
      <div id="chart_div" style="height: 60vh;"></div>
    </section>
    
    <aside class="pure-u-1 pure-u-md-1-3" id="right-column">
      <div id="chart_div_1" style="height: 25vh;"></div>
      <div id="chart_div_2" style="height: 35vh;"></div>
    </aside>
  </main>

  <footer class="pure-u-1">
    <label for="yearSlider">Year: </label>
    <span id="yearValue">2010</span>
    <input type="range" id="yearSlider" min="2010" max="2021" value="2010">
  </footer>

  <!-- Ваши скрипты и Google Charts -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    // Код для инициализации графиков и других элементов
  </script>
</body>
</html>
